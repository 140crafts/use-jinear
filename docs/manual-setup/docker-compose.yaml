version: "3"

services:
  jinear-db:
    container_name: jinear-db
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: jinear
      POSTGRES_USER: db-user
      POSTGRES_PASSWORD: db-pass
      PGDATA: /var/lib/postgresql/data
    volumes:
      - ".data/postgres:/var/lib/postgresql/data"
    ports:
      - "5432:5432"
    networks:
      - jinear-default

  jinear-db-backup:
    container_name: jinear-db-backup
    image: postgres:15
    restart: always
    depends_on:
      - jinear-db
    environment:
      TZ: "Asia/Istanbul"  # You can choose the appropriate timezone. It's for GMT+3
    volumes:
      - ".backups:/backups"
      - ".config:/config"
    entrypoint: /bin/bash
    command: /config/db-backup.sh
    networks:
      - jinear-default

  jinear-redis:
    image: redis:6.2-alpine
    restart: always
    ports:
      - "6379:6379"
      - "18020:6379"
    command: redis-server --requirepass redis-pass
    volumes:
      - ".data/redis:/data"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      interval: 1s
      timeout: 3s
      retries: 5
    networks:
      - jinear-default

  jinear-minio:
    container_name: jinear-minio
    image: minio/minio:RELEASE.2025-03-12T18-04-18Z
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ".data/minio:/data"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio-user
      MINIO_ROOT_PASSWORD: minio-pass
    networks:
      - jinear-default

  jinear-core:
    container_name: jinear-core
    image: registry.gitlab.com/140crafts/use-jinear/jinear-core:latest
    depends_on:
      - jinear-db
      - jinear-redis
      - jinear-minio
    volumes:
      - ".logs/jinear-core:/app/logs"
      - ".config:/config"
    environment:
      jasypt.encryptor.password: encryptor-pass
      jasypt.encryptor.algorithm: PBEWithMD5AndDES
      #      GOOGLE_APPLICATION_CREDENTIALS: /config/gcloud-serviceaccount.json
      JWT_SECRET: change-me
      JWT_DOMAIN: company.com
      FE_PATH: https://your-instance.company.com
      # MinIO - use same credentials as jinear-minio service above
      MINIO_KEY: minio-user
      MINIO_SECRET: minio-pass
      MINIO_ROOT: http://jinear-minio:9000
      MINIO_BASE_PATH: https://files.your-instance.company.com/
      # Apple Sign In (optional)
      APPLE_TEAM_ID: not-configured
      APPLE_KEY_ID: not-configured
      APPLE_KEY_PATH: /config/AuthKey.p8
      APPLE_CLIENT_ID: not-configured
      APPLE_WEB_CLIENT_ID: not-configured
      APPLE_WEB_REDIRECT_URL: not-configured
    restart: always
    privileged: true
    ports:
      - 19010:8008
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8008" ]
      interval: 30s
      timeout: 15s
      retries: 5
    networks:
      - jinear-default

  jinear-web:
    container_name: jinear-web
    image: registry.gitlab.com/140crafts/use-jinear/jinear-web:latest
    depends_on:
      - jinear-core
    volumes:
      - ".logs/jinear-web:/logs"
    restart: always
    environment:
      - NEXT_PUBLIC_HOST=https://your-instance.company.com/
      - NEXT_PUBLIC_API_ROOT=https://api.your-instance.company.com/
      - NEXT_PUBLIC_SOCKET_ROOT=https://message.your-instance.company.com/
      - NEXT_PUBLIC_POSTHOG_KEY=posthog-key
      - NEXT_PUBLIC_POSTHOG_HOST=https://us.i.posthog.com
      - NEXT_PUBLIC_APPLE_CLIENT_ID=
      - NEXT_PUBLIC_APPLE_REDIRECT_URI=
    privileged: true
    ports:
      - 19020:3000
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000" ]
      interval: 30s
      timeout: 15s
      retries: 5
    networks:
      - jinear-default

  jinear-pages:
    container_name: jinear-pages
    image: registry.gitlab.com/140crafts/use-jinear/jinear-pages:latest
    depends_on:
      - jinear-core
    volumes:
      - ".logs/jinear-pages:/logs"
    restart: always
    environment:
      - NEXT_PUBLIC_API_ROOT=https://api.your-instance.company.com/
      - NEXT_PUBLIC_POSTHOG_KEY=posthog-key
      - NEXT_PUBLIC_POSTHOG_HOST=https://us.i.posthog.com
    privileged: true
    ports:
      - 19030:3000
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000" ]
      interval: 30s
      timeout: 15s
      retries: 5
    networks:
      - jinear-default

  jinear-caddy:
    container_name: jinear-caddy
    image: registry.gitlab.com/140crafts/use-jinear/jinear-caddy-custom:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "127.0.0.1:2019:2019"
    volumes:
      - $PWD/.data/caddy/conf:/etc/caddy
      - $PWD/.data/caddy/site:/srv
      - .data/caddy/data:/data
      - .data/caddy/config:/config
    networks:
      - jinear-default

  jinear-message:
    container_name: jinear-message
    image: registry.gitlab.com/140crafts/use-jinear/jinear-message-service:latest
    depends_on:
      - jinear-core
    volumes:
      - ".logs/jinear-message:/logs"
    restart: always
    environment:
      - PORT=3001
      - CORE_ENDPOINT=http://jinear-core:8008
      - INTERNAL_AUTH_TOKEN=your-messaging-api-token
      - ALLOWED_ORIGIN=https://your-instance.company.com
    privileged: true
    ports:
      - 19050:3001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 15s
      retries: 5
    networks:
      - jinear-default

networks:
  jinear-default:
    driver: bridge