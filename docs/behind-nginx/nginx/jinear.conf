# Jinear behind nginx. Recommended topology: nginx (TLS) → Caddy → services.
#
# nginx terminates TLS and forwards plain HTTP to the bundled Caddy, which does the
# internal routing. Point all three subdomains at the same Caddy HTTP port.
#
# Two lines below are load-bearing and easy to miss:
#   * proxy_set_header Host $host;     Caddy routes by Host, and MinIO validates S3
#                                      presigned-URL signatures against it. Without this,
#                                      file uploads/downloads fail with 403.
#   * client_max_body_size 0;          nginx's 1 MB default rejects file uploads with 413.
#                                      0 = unlimited (or set an explicit cap, e.g. 512m).
#
# Replace jinear.example.com with your domain and the ssl_certificate paths with your own
# (a self-signed cert is fine; nothing but browsers needs to trust it).

# --- Caddy upstream: the bundled jinear-caddy HTTP port (the HTTP_PORT you chose) ---
upstream jinear_caddy {
    server 127.0.0.1:8080;
}

# Shared proxy settings for every Jinear vhost.
# (In nginx these directives are per-location/-server, so we repeat the include.)

# Main app
server {
    listen 443 ssl;
    http2 on;
    server_name jinear.example.com;

    ssl_certificate     /etc/nginx/certs/jinear.example.com.crt;
    ssl_certificate_key /etc/nginx/certs/jinear.example.com.key;

    location / {
        proxy_pass http://jinear_caddy;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API
server {
    listen 443 ssl;
    http2 on;
    server_name api.jinear.example.com;

    ssl_certificate     /etc/nginx/certs/jinear.example.com.crt;
    ssl_certificate_key /etc/nginx/certs/jinear.example.com.key;

    location / {
        proxy_pass http://jinear_caddy;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Files (MinIO): needs the two extra directives called out at the top of this file.
server {
    listen 443 ssl;
    http2 on;
    server_name files.jinear.example.com;

    ssl_certificate     /etc/nginx/certs/jinear.example.com.crt;
    ssl_certificate_key /etc/nginx/certs/jinear.example.com.key;

    # Allow large file uploads to stream through to MinIO.
    client_max_body_size 0;
    proxy_request_buffering off;

    location / {
        proxy_pass http://jinear_caddy;
        proxy_set_header Host              $host;   # required: keeps files.<domain> for the S3 signature
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Optional: redirect http → https for all three names.
server {
    listen 80;
    server_name jinear.example.com api.jinear.example.com files.jinear.example.com;
    return 301 https://$host$request_uri;
}
