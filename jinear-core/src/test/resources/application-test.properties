# Used by any test that boots a Spring context. The MCP suite mostly runs standalone
# MockMvc and plain Mockito, so nothing here is required for it to pass; it exists so a
# future integration test has a database that needs no external service.
spring.datasource.url=jdbc:h2:mem:jinear;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.liquibase.change-log=classpath:db/changelog/changelog-master.xml
jwt.secret=test-session-secret
jwt.messaging.secret=test-messaging-secret
jwt.is-secure=false
jwt.domain=localhost
jwt.include-domain=false
jwt.include-same-site=false
jwt.same-site=None
jinear.mcp.enabled=true
jinear.mcp.issuer-url=https://api.jinear.test
jinear.mcp.resource-url=https://api.jinear.test/mcp
jwt.mcp.secret=test-mcp-secret-which-differs-from-the-session-secret
fe.mcp-consent-url=https://app.jinear.test/oauth/consent?request_id={requestId}
