version: "3"

services:
  jinear-db:
    container_name: jinear-db
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - ".data/postgres:/var/lib/postgresql/data"
    networks:
      - jinear-default

  jinear-db-backup:
    container_name: jinear-db-backup
    image: postgres:15
    restart: always
    depends_on:
      - jinear-db
    environment:
      TZ: "${TIMEZONE}"
      POSTGRES_HOST: jinear-db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ".backups:/backups"
      - ".config:/config"
    entrypoint: /bin/bash
    command: /config/db-backup.sh
    networks:
      - jinear-default

  jinear-redis:
    container_name: jinear-redis
    image: redis:6.2-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ".data/redis:/data"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG" ]
      interval: 1s
      timeout: 3s
      retries: 5
    networks:
      - jinear-default

  jinear-minio:
    container_name: jinear-minio
    image: minio/minio:RELEASE.2025-03-12T18-04-18Z
    restart: always
    volumes:
      - ".data/minio:/data"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT: "off"
    networks:
      - jinear-default

  jinear-core:
    container_name: jinear-core
    image: registry.gitlab.com/140crafts/use-jinear/jinear-core:latest
    depends_on:
      - jinear-db
      - jinear-redis
      - jinear-minio
    volumes:
      - ".logs/jinear-core:/app/logs"
      - ".config:/config"
    environment:
      # Jasypt encryption
      jasypt.encryptor.password: ${ENCRYPTOR_PASSWORD}
      jasypt.encryptor.algorithm: PBEWithMD5AndDES
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_DOMAIN: ${DOMAIN}
      # JWT cookie security (relaxed automatically for plain-HTTP installs)
      JWT_IS_SECURE: ${JWT_IS_SECURE:-true}
      JWT_SAME_SITE: ${JWT_SAME_SITE:-None}
      # Frontend
      FE_PATH: ${EXTERNAL_SCHEME:-https}://${DOMAIN}${PUBLIC_PORT_SUFFIX:-}
      CORS_ORIGINS: ${EXTERNAL_SCHEME:-https}://${DOMAIN}${PUBLIC_PORT_SUFFIX:-}
      # MinIO - uses same credentials as minio service
      MINIO_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET: ${MINIO_ROOT_PASSWORD}
      MINIO_ROOT: http://jinear-minio:9000
      MINIO_BASE_PATH: ${EXTERNAL_SCHEME:-https}://${FILES_DOMAIN}${PUBLIC_PORT_SUFFIX:-}/
      # Database (passed to application.properties)
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Email
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SENDER_ADDRESS: ${MAIL_SENDER_ADDRESS:-noreply@example.com}
      # Internal auth
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN}
      # Rate limiting
      RATE_LIMIT_PUBLIC_CAPACITY: ${RATE_LIMIT_PUBLIC_CAPACITY:-25}
      RATE_LIMIT_AUTH_CAPACITY: ${RATE_LIMIT_AUTH_CAPACITY:-100}
      # Instance management (optional) - admin account for the /admin panel
      MANAGEMENT_ENABLED: ${MANAGEMENT_ENABLED:-false}
      MANAGEMENT_ADMIN_EMAIL: ${MANAGEMENT_ADMIN_EMAIL:-}
      MANAGEMENT_ADMIN_PASSWORD: ${MANAGEMENT_ADMIN_PASSWORD:-}
      # OAuth authorization server - issues the tokens a connected app carries.
      # No switch of its own: MCP_ENABLED below turns both halves on and off, because
      # MCP is the only resource these tokens open.
      # The URLs are derived here rather than asked for, because they have to agree:
      # the issuer is the API origin that serves /.well-known, and the consent screen
      # is on the app.
      OAUTH_ISSUER_URL: ${EXTERNAL_SCHEME:-https}://${API_DOMAIN}${PUBLIC_PORT_SUFFIX:-}
      OAUTH_CONSENT_URL: ${EXTERNAL_SCHEME:-https}://${DOMAIN}${PUBLIC_PORT_SUFFIX:-}/oauth/consent?request_id={requestId}
      OAUTH_JWT_SECRET: ${OAUTH_JWT_SECRET:-}
      OAUTH_DCR_ENABLED: ${OAUTH_DCR_ENABLED:-true}
      OAUTH_CIMD_ALLOWED_HOSTS: ${OAUTH_CIMD_ALLOWED_HOSTS:-}
      # MCP server (optional) - lets members connect Claude or ChatGPT.
      # MCP_RESOURCE_URL is exactly what a member pastes into their client.
      MCP_ENABLED: ${MCP_ENABLED:-false}
      MCP_RESOURCE_URL: ${EXTERNAL_SCHEME:-https}://${API_DOMAIN}${PUBLIC_PORT_SUFFIX:-}/mcp
      MCP_LOG_RETENTION_DAYS: ${MCP_LOG_RETENTION_DAYS:-30}
      # Apple Sign In (optional) - leave APPLE_ENABLED=false to boot without an AuthKey.p8
      APPLE_ENABLED: ${APPLE_ENABLED:-false}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-not-configured}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-not-configured}
      APPLE_KEY_PATH: ${APPLE_KEY_PATH:-/config/AuthKey.p8}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-not-configured}
      APPLE_WEB_CLIENT_ID: ${APPLE_WEB_CLIENT_ID:-not-configured}
      APPLE_WEB_REDIRECT_URL: ${APPLE_WEB_REDIRECT_URL:-not-configured}
    restart: always
    privileged: true
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8008/" ]
      interval: 30s
      timeout: 15s
      retries: 5
    networks:
      - jinear-default

  jinear-app:
    container_name: jinear-app
    image: registry.gitlab.com/140crafts/use-jinear/jinear-app:latest
    depends_on:
      - jinear-core
    restart: always
    # Runtime config: the image substitutes these into its static bundle at
    # container start (import-meta-env), so one image serves any domain. Every
    # VITE_* key must be present (empty is fine) or the container won't boot.
    # Firebase (web push) and Apple Sign In are optional; leave blank to disable.
    environment:
      - VITE_API_URL=${EXTERNAL_SCHEME:-https}://${API_DOMAIN}${PUBLIC_PORT_SUFFIX:-}/
      - VITE_HOST=${EXTERNAL_SCHEME:-https}://${DOMAIN}${PUBLIC_PORT_SUFFIX:-}/
      - VITE_APPLE_CLIENT_ID=${VITE_APPLE_CLIENT_ID:-}
      - VITE_APPLE_REDIRECT_URI=${VITE_APPLE_REDIRECT_URI:-}
      - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY:-}
      - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN:-}
      - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID:-}
      - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET:-}
      - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
      - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID:-}
      - VITE_FIREBASE_MEASUREMENT_ID=${VITE_FIREBASE_MEASUREMENT_ID:-}
      - VITE_FIREBASE_VAPID_KEY=${VITE_FIREBASE_VAPID_KEY:-}
      - VITE_POSTHOG_KEY=${POSTHOG_KEY:-}
      - VITE_POSTHOG_HOST=${POSTHOG_HOST:-https://us.i.posthog.com}
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/" ]
      interval: 30s
      timeout: 15s
      retries: 5
    networks:
      - jinear-default

  jinear-caddy:
    container_name: jinear-caddy
    image: caddy:2.10.0
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "${HTTP_PORT:-80}:80"
      # jinear-https-ports (installer removes these 2 lines when AUTO_HTTPS=false)
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./.data/caddy/conf:/etc/caddy
      - ./.data/caddy/site:/srv
      - ./.data/caddy/data:/data
      - ./.data/caddy/config:/config
    networks:
      - jinear-default

networks:
  jinear-default:
    driver: bridge
