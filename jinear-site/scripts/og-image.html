<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #fbfaf7;
    --bg-sunk: #f5f3ee;
    --border: #e8e4db;
    --ink: #1c1a16;
    --ink-2: #4f4b43;
    --ink-3: #8b857a;
    --acc: #d96a1a;
    --sans: "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: var(--bg);
    font-family: var(--sans);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 78px 84px;
    position: relative;
    overflow: hidden;
  }
  body::after {
    content: "";
    position: absolute;
    right: -220px;
    top: -220px;
    width: 760px;
    height: 760px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(217, 106, 26, 0.13) 0%, rgba(217, 106, 26, 0) 68%);
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  h1 {
    font-size: 78px;
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1.02;
    white-space: nowrap;
    margin-top: 26px;
  }
  h1 .accent { color: var(--acc); }
  p {
    font-size: 27px;
    line-height: 1.5;
    color: var(--ink-2);
    white-space: nowrap;
    margin-top: 26px;
  }
  .foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid var(--border);
    padding-top: 26px;
    position: relative;
    z-index: 1;
  }
  .wordmark {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -0.03em;
  }
  .wordmark .dot { color: var(--acc); }
  .meta {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 500;
    color: var(--ink-3);
  }
  .top { position: relative; z-index: 1; }
</style>
</head>
<body>
  <div class="top">
    <div class="eyebrow">Open source · AGPL-3.0</div>
    <h1>Project management<br />you can <span class="accent">actually own.</span></h1>
    <p>Tasks, calendar, notes and files.<br />Self-hosted with one Docker Compose command.</p>
  </div>

  <div class="foot">
    <div class="wordmark">jinear<span class="dot">.</span>co</div>
    <div class="meta">No per-user pricing</div>
  </div>
</body>
</html>
