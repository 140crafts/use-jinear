stages:
  - version
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

.core_changes: &core_changes
  changes:
    - jinear-core/**/*
    - .gitlab-ci.yml

.app_changes: &app_changes
  changes:
    - jinear-app/**/*
    - .gitlab-ci.yml

.site_changes: &site_changes
  changes:
    - jinear-site/**/*
    - .gitlab-ci.yml

.rate_limiter_changes: &rate_limiter_changes
  changes:
    - jinear-shared-libs/jinear-rate-limiter/**/*
    - .gitlab-ci.yml

.maven_setup: &maven_setup
  image: $CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX/maven:3.9-eclipse-temurin-17
  before_script:
    - |
      # Create Maven settings.xml for GitLab Package Registry authentication
      mkdir -p ~/.m2
      cat > ~/.m2/settings.xml << EOF
      <settings>
        <servers>
          <server>
            <id>gitlab-maven</id>
            <configuration>
              <httpHeaders>
                <property>
                  <name>Job-Token</name>
                  <value>${CI_JOB_TOKEN}</value>
                </property>
              </httpHeaders>
            </configuration>
          </server>
        </servers>
      </settings>
      EOF

.docker_setup: &docker_setup
  image: $CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX/docker:latest
  before_script:
    - echo $CI_REGISTRY_PASSWORD | docker login registry.gitlab.com -u $CI_REGISTRY_USER --password-stdin
    - echo $CI_DEPENDENCY_PROXY_PASSWORD | docker login $CI_DEPENDENCY_PROXY_SERVER -u $CI_DEPENDENCY_PROXY_USER --password-stdin
    - apk add --no-cache curl
    - mkdir -p ~/.docker/cli-plugins/
    - curl -sSL https://github.com/docker/buildx/releases/download/v0.16.2/buildx-v0.16.2.linux-arm64 -o ~/.docker/cli-plugins/docker-buildx
    - chmod +x ~/.docker/cli-plugins/docker-buildx
    - docker buildx version
    - docker buildx create --use --name multi-arch-builder
    - docker buildx inspect --bootstrap
    - |
      # Set TAG variable - prefer CI_COMMIT_TAG, fallback to CI_COMMIT_SHORT_SHA
      if [ -n "$CI_COMMIT_TAG" ]; then
        export TAG="$CI_COMMIT_TAG"
      else
        export TAG="$CI_COMMIT_SHORT_SHA"
      fi
      echo "Using TAG=${TAG}"
      # Set image variables
      export JINEAR_CORE_IMAGE="registry.gitlab.com/${CI_PROJECT_PATH}/jinear-core:${TAG}"
      export JINEAR_CORE_IMAGE_LATEST="registry.gitlab.com/${CI_PROJECT_PATH}/jinear-core:latest"
      export JINEAR_APP_IMAGE="registry.gitlab.com/${CI_PROJECT_PATH}/jinear-app:${TAG}"
      export JINEAR_APP_IMAGE_LATEST="registry.gitlab.com/${CI_PROJECT_PATH}/jinear-app:latest"
      export JINEAR_SITE_IMAGE="registry.gitlab.com/${CI_PROJECT_PATH}/jinear-site:${TAG}"
      export JINEAR_SITE_IMAGE_LATEST="registry.gitlab.com/${CI_PROJECT_PATH}/jinear-site:latest"

bump_version:
  stage: version
  image: $CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX/alpine:latest
  before_script:
    - apk add --no-cache git
    - git config --global user.email "gitlab-ci@gitlab.com"
    - git config --global user.name "GitLab CI"
    - git remote set-url origin "https://${GITLAB_USER_LOGIN}:${JINEAR_CI_TAG_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git fetch --tags
  script:
    - |
      latest_tag=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
      if [ -z "$latest_tag" ]; then
        echo "No tags found. Starting at v0.1.1638"
        new_tag="v0.1.1638"
      else
        new_tag=$(echo "$latest_tag" | awk -F. -v OFS=. '{$NF++;print}')
      fi
      echo "Bumping version to ${new_tag}"
      git tag -a "${new_tag}" -m "Release ${new_tag}"
      git push origin "${new_tag}"
      echo "Created and pushed tag: ${new_tag}"
      echo "A new pipeline will be triggered automatically for this tag"
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

rate-limiter:build:
  <<: *maven_setup
  stage: build
  script:
    - cd jinear-shared-libs/jinear-rate-limiter
    # Use git tag version (e.g., v0.1.1234 -> 0.1.1234) or fallback to pipeline ID
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION=$(echo $CI_COMMIT_TAG | sed 's/^v//')
      else
        VERSION="1.0.${CI_PIPELINE_IID}-SNAPSHOT"
      fi
      echo "Building version: $VERSION"
    - mvn deploy -DskipTests -Drevision=$VERSION
  rules:
    - if: '$CI_COMMIT_TAG'
      <<: *rate_limiter_changes
    - if: '$CI_COMMIT_TAG'
      <<: *core_changes
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      <<: *rate_limiter_changes
      when: manual
      allow_failure: true

core:build:
  <<: *docker_setup
  stage: build
  script:
    - cd jinear-core
    - docker buildx build --platform linux/amd64,linux/arm64
        --build-arg MAVEN_IMAGE=$CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX/maven:3.9.9-amazoncorretto-17-alpine
        --build-arg RUNTIME_IMAGE=$CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX/eclipse-temurin:21-jre-alpine
        --cache-from type=registry,ref=${JINEAR_CORE_IMAGE_LATEST}-buildcache
        --cache-to type=registry,ref=${JINEAR_CORE_IMAGE_LATEST}-buildcache,mode=max
        -t ${JINEAR_CORE_IMAGE} --push .
  timeout: 90m
  needs:
    - job: rate-limiter:build
      optional: true
  rules:
    - if: '$CI_COMMIT_TAG'
      <<: *core_changes
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      <<: *core_changes
      when: manual
      allow_failure: true

core:deploy:
  <<: *docker_setup
  stage: deploy
  script:
    - docker buildx imagetools create -t ${JINEAR_CORE_IMAGE_LATEST} ${JINEAR_CORE_IMAGE}
  rules:
    - if: '$CI_COMMIT_TAG'
      <<: *core_changes
  needs:
    - core:build

app:build:
  <<: *docker_setup
  stage: build
  script:
    - cd jinear-app
    - docker buildx build --platform linux/amd64,linux/arm64
        --build-arg BUILDER_IMAGE=$CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX/node:22-alpine
        --build-arg RUNTIME_IMAGE=$CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX/caddy:2-alpine
        -t ${JINEAR_APP_IMAGE} --push .
  timeout: 90m
  rules:
    - if: '$CI_COMMIT_TAG'
      <<: *app_changes
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      <<: *app_changes
      when: manual
      allow_failure: true

app:deploy:
  <<: *docker_setup
  stage: deploy
  script:
    - docker buildx imagetools create -t ${JINEAR_APP_IMAGE_LATEST} ${JINEAR_APP_IMAGE}
  timeout: 90m
  rules:
    - if: '$CI_COMMIT_TAG'
      <<: *app_changes
  needs:
    - app:build

site:build:
  <<: *docker_setup
  stage: build
  script:
    - cd jinear-site
    - docker buildx build --platform linux/amd64,linux/arm64
        --build-arg BUILDER_IMAGE=$CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX/node:20-alpine
        --build-arg RUNTIME_IMAGE=$CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX/caddy:2-alpine
        --build-arg NEXT_PUBLIC_SITE_URL=https://jinear.co
        --build-arg NEXT_PUBLIC_APP_URL=https://app.jinear.co
        -t ${JINEAR_SITE_IMAGE} --push .
  timeout: 90m
  rules:
    - if: '$CI_COMMIT_TAG'
      <<: *site_changes
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      <<: *site_changes
      when: manual
      allow_failure: true

site:deploy:
  <<: *docker_setup
  stage: deploy
  script:
    - docker buildx imagetools create -t ${JINEAR_SITE_IMAGE_LATEST} ${JINEAR_SITE_IMAGE}
  timeout: 90m
  rules:
    - if: '$CI_COMMIT_TAG'
      <<: *site_changes
  needs:
    - site:build

site:indexnow:
  image: $CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX/node:20-alpine
  stage: deploy
  script:
    - cd jinear-site
    - node scripts/indexnow.mjs
  rules:
    - if: '$CI_COMMIT_TAG'
      <<: *site_changes
      when: manual
      allow_failure: true
  needs:
    - site:deploy